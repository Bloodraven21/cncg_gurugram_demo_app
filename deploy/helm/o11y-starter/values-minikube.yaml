# minikube — self-contained values file
#
# Usage:
#   helm upgrade --install o11y-starter ./deploy/helm/o11y-starter -f values-minikube.yaml
#
# Prerequisites:
#   minikube addons enable ingress          # for Ingress
#   minikube addons enable ingress-dns      # optional: resolves .local hostnames
#
# For Gateway API instead of Ingress:
#   kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
#   kubectl apply -f https://github.com/nginx-gateway-fabric/nginx-gateway-fabric/releases/download/v1.4.0/crds.yaml
#   kubectl apply -f https://github.com/nginx-gateway-fabric/nginx-gateway-fabric/releases/download/v1.4.0/nginx-gateway.yaml
#   Then set gateway.enabled: true and ingress.enabled: false below.

replicaCount: 1

image:
  repository: demo-app
  pullPolicy: IfNotPresent
  # Overrides the image tag; defaults to the chart appVersion
  tag: "v2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# nginx Ingress (minikube built-in addon)
# Disable and set gateway.enabled: true to use Gateway API instead.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: o11y-starter.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API via nginx-gateway-fabric
# Enable as an alternative to Ingress above — do not enable both.
gateway:
  enabled: false
  create: true
  name: ""
  existingGatewayName: ""
  className: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "o11y-starter.local"
  httpRoute:
    hostnames:
      - "o11y-starter.local"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 64Mi
  # limits:
  #   cpu: 500m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Application config — maps to environment variables read by internal/config/config.go.
# These values are written into the ConfigMap (when configMap.enabled is true).
config:
  # OTEL_EXPORTER_OTLP_ENDPOINT: gRPC endpoint for the OpenTelemetry Collector
  otlpEndpoint: "otel-collector:4317"
  # OTEL_SERVICE_NAME
  serviceName: "o11y-starter"
  # LOG_LEVEL: debug | info | warn | error
  logLevel: "info"
  # HTTP_ADDR: listening address inside the container (keep :8080 to match EXPOSE)
  httpAddr: ":8080"

# ConfigMap — non-sensitive environment variables loaded via envFrom.
configMap:
  enabled: true
  # Additional key/value pairs merged into the ConfigMap alongside core config.* values.
  # extraData:
  #   FEATURE_FLAG: "true"
  #   REGION: "us-east-1"
  extraData: {}

# Secret — sensitive environment variables loaded via envFrom.
#
# type: none     — no Secret resource is created; inject secrets externally
# type: native   — create a Kubernetes Secret from secret.data
# type: external — create an ExternalSecret (requires External Secrets Operator)
secret:
  type: none

  # --- native -----------------------------------------------------------------
  # Simplest option for local dev. Pass values at deploy time to avoid
  # committing credentials:
  #   helm upgrade --install ... --set secret.type=native \
  #     --set secret.data.DATABASE_URL="postgres://localhost:5432/dev"
  data: {}

  # --- external (External Secrets Operator) -----------------------------------
  # Useful for testing ESO integration locally with a fake provider.
  external:
    refreshInterval: "1h"
    secretStoreRef:
      # Name of the SecretStore or ClusterSecretStore CR in the cluster.
      name: ""
      # "SecretStore" (namespace-scoped) or "ClusterSecretStore" (cluster-wide).
      kind: SecretStore
    # Name of the resulting k8s Secret. Defaults to the release fullname.
    targetName: ""
    # Owner | Merge | Orphan
    creationPolicy: Owner
    # Map individual keys from the external store into the Secret.
    # data:
    #   - secretKey: DATABASE_URL
    #     remoteRef:
    #       key: database-url
    data: []
    # Bulk-import all keys under a remote path as individual Secret entries.
    # dataFrom:
    #   - extract:
    #       key: myapp/dev/secrets
    dataFrom: []
