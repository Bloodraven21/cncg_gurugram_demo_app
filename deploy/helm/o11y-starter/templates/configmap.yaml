{{- if .Values.configMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "o11y-starter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "o11y-starter.labels" . | nindent 4 }}
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otlpEndpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.serviceName | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- range $k, $v := .Values.configMap.extraData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
