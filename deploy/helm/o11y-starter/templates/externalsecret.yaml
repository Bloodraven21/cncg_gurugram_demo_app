{{- if eq .Values.secret.type "external" -}}
{{- $eso := .Values.secret.external -}}
{{- if not $eso.secretStoreRef.name -}}
  {{- fail "secret.external.secretStoreRef.name is required when secret.type is \"external\"" }}
{{- end -}}
{{- if and (empty $eso.data) (empty $eso.dataFrom) -}}
  {{- fail "secret.external.data or secret.external.dataFrom must have at least one entry when secret.type is \"external\"" }}
{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "o11y-starter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "o11y-starter.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $eso.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $eso.secretStoreRef.name }}
    kind: {{ $eso.secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ include "o11y-starter.secretName" . }}
    creationPolicy: {{ $eso.creationPolicy | default "Owner" }}
  {{- if $eso.data }}
  data:
    {{- range $eso.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
        {{- if .remoteRef.version }}
        version: {{ .remoteRef.version }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if $eso.dataFrom }}
  dataFrom:
    {{- range $eso.dataFrom }}
    - {{- if .extract }}
      extract:
        key: {{ .extract.key }}
        {{- if .extract.version }}
        version: {{ .extract.version }}
        {{- end }}
      {{- end }}
      {{- if .find }}
      find:
        {{- toYaml .find | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
