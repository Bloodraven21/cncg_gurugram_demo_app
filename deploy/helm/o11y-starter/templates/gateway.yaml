{{- if and .Values.gateway.enabled .Values.gateway.create -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "o11y-starter.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "o11y-starter.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled and gateway.create are true" .Values.gateway.className }}
  listeners:
    {{- range .Values.gateway.listeners }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      {{- if .hostname }}
      hostname: {{ .hostname | quote }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
