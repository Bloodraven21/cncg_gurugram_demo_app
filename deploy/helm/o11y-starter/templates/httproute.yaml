{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "o11y-starter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "o11y-starter.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "o11y-starter.httpRouteParentRef" . }}
      namespace: {{ .Release.Namespace }}
  {{- with .Values.gateway.httpRoute.hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.gateway.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- range . }}
        - path:
            type: {{ .path.type }}
            value: {{ .path.value | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ include "o11y-starter.fullname" $ }}
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
